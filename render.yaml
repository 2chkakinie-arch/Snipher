# LFM2.5-1.2B-JP のフルウェイトもロードする場合（VPS 相当のメモリが必要）:
#   buildCommand: "pip install -r requirements.txt -r requirements-llm.txt"
#   plan: starter 以上（torch + 1.2B は 512MB では足りない）
# 既定（free）でも内蔵ニューラルコア＋知識ベースで会話できます。
services:
  - type: web
    name: snipher
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn snipher.api:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
    autoDeploy: true
