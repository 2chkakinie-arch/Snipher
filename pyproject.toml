[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "snipher"
version = "0.2.0"
description = "超小型・確率的日本語AI + LFM2.5-1.2B-JP チャット（未知文字学習・テンプレートフォールバック付き）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Snipher" }]
dependencies = [
  "fastapi>=0.100",
  "uvicorn>=0.23",
  "pydantic>=2.0",
]

[project.optional-dependencies]
# ニューラルエンジン（LFM2.5-1.2B-JP）を使う場合
llm = [
  "torch>=2.3",
  "transformers>=4.57",
  "tokenizers>=0.20",
  "safetensors>=0.4",
  "accelerate>=0.30",
]
dev = ["pytest", "pytest-timeout", "httpx"]

[tool.setuptools]
packages = ["snipher", "snipher.lfm", "snipher.web"]

[tool.setuptools.package-data]
snipher = ["data/*.json", "web/*.html"]

# Vercel Python ランタイムのエントリポイント。
# `snipher.api` モジュールとしてロードされるため、パッケージ内 import が正しく解決される。
[tool.vercel]
entrypoint = "snipher.api:app"
