[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "snipher"
version = "2.0.0"
description = "LFM2.5-1.2B-JP を内部構造として動かす高速日本語AIチャット（蒸留ニューラルコア同梱・サーバーレス即動作・全自動モデル取得・llama.cpp/torch 両対応・助動詞補正・BM25 知識ベース）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Snipher" }]
dependencies = [
  "fastapi>=0.100",
  "uvicorn>=0.23",
  "pydantic>=2.0",
  "python-multipart>=0.0.9",
  "numpy>=1.24",
]

[project.optional-dependencies]
# ニューラルコア（LFM2.5-1.2B-JP）を使う場合 — torch バックエンド
llm = [
  "torch>=2.3",
  "transformers>=4.57",
  "tokenizers>=0.20",
  "safetensors>=0.4",
  "accelerate>=0.30",
]
# CPU 最速の GGUF バックエンド（llama.cpp）。torch より軽いので推奨。
gguf = [
  "llama-cpp-python>=0.3.9",
]
dev = ["pytest", "pytest-timeout", "httpx"]

[tool.setuptools]
packages = ["snipher", "snipher.lfm", "snipher.neural", "snipher.web"]

[tool.setuptools.package-data]
snipher = ["data/*.json", "data/neural/*.npz", "data/neural/*.json", "web/*.html", "web/*.js", "web/*.css"]

# Vercel Python ランタイムのエントリポイント。
# `snipher.api` モジュールとしてロードされるため、パッケージ内 import が正しく解決される。
[tool.vercel]
entrypoint = "snipher.api:app"
